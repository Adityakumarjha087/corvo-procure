# Render blueprint: one Docker web service + a Postgres database.
services:
  - type: web
    name: corvo-procure
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corvo-procure-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
databases:
  - name: corvo-procure-db
    plan: free
